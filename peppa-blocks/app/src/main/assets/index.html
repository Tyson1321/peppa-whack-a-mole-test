<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>佩奇的积木乐园</title><link rel="stylesheet" href="style.css"><body>
<main id="home"><div class="eyebrow">PEPPA'S LITTLE BUILDERS</div><h1>佩奇的积木乐园<span>和佩奇一家，一起搭出小小奇迹</span></h1><img class="family" src="family.jpg" alt="佩奇、乔治、猪妈妈和猪爸爸"><div id="levels"></div><p class="foot">没有倒计时 · 慢慢想，自由搭 · 五个小故事</p></main>
<section id="game" hidden><header><button id="homeBtn">⌂ 关卡</button><div><small id="chapter"></small><h2 id="title"></h2></div><button id="sound">♫ 声音开</button></header><div class="story"><img src="family.jpg" alt="佩奇一家"><p id="story"></p><button id="read" aria-label="朗读故事">▶</button></div><div class="workspace"><canvas id="board" aria-label="积木搭建区"></canvas><aside><b>我的积木盒</b><span id="count"></span><div id="tray"></div></aside></div><footer><button id="rotate">↻ 旋转</button><button id="undo">↶ 撤销</button><button id="reset">重新搭</button><button id="hint">☀ 提示</button><button id="check" class="primary">搭好啦！ →</button></footer><div id="status" role="status">拖动积木到格子里，也可以点选积木，再点格子放下。</div></section>
<div id="modal" hidden><div class="card"><div class="stars">★ ★ ★</div><h2>你的小创意，成功啦！</h2><p id="success"></p><button id="again">再搭一种</button><button id="next" class="primary">下一关 →</button></div></div><script src="engine.js"></script><script src="game.js"></script></body></html>
