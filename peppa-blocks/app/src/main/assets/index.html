<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>佩奇的积木乐园 · 小小工程师</title><link rel="stylesheet" href="style.css"><body>
<main id="home"><div class="eyebrow">小小工程师 · 第二版</div><h1>佩奇的积木乐园<span>搭起来，走一走，再想一个新办法</span></h1><img class="family" src="family.jpg" alt="佩奇、乔治、猪妈妈和猪爸爸"><div id="levels"></div><button id="freeHome" class="free">✦ 自由搭建工坊</button><p class="foot">没有倒计时 · 可以反复修改 · 进度自动保存</p></main>
<section id="game" hidden><header><button id="homeBtn">⌂ 关卡</button><div><small id="chapter"></small><h2 id="title"></h2></div><button id="sound">♫ 声音开</button></header><div class="story"><img src="family.jpg" alt="佩奇一家"><p id="story"></p><button id="read" aria-label="朗读故事">▶</button></div><div id="goals"></div><div class="workspace"><div class="stage"><canvas id="board" aria-label="积木搭建区"></canvas><div class="stage-note">卡扣积木 · 拖动拼接 · 点选后旋转</div></div><aside><b>我的积木盒</b><span id="count"></span><div id="tray"></div><div id="pieceInfo">长条跨越 · L形转角 · 三角坡道</div></aside></div><footer><button id="rotate">↻ 旋转</button><button id="remove">↥ 收回</button><button id="undo">↶ 撤销</button><button id="reset">重新搭</button><button id="hint">☀ 提示</button><button id="check" class="primary">▶ 请大家试一试</button></footer><div id="status" role="status">先选积木，再点场地放下，也可以直接拖动。</div></section>
<div id="modal" hidden><div class="card"><div class="stars" id="stars"></div><h2>你的搭法成功啦！</h2><p id="success"></p><button id="improve">继续改进</button><button id="again">再搭一种</button><button id="next" class="primary">下一关 →</button></div></div><script src="engine.js"></script><script src="game.js"></script></body></html>
