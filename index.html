function home(){state='home';run=null;stopMusic();clearEffects();$('overlay').hidden=true;document.body.classList.remove('paused');setTop(false);$('content').innerHTML='<section class="home"><div class="peppaDock"><div class="speech">一起去花园玩吧！</div>'+art('peppa')+'</div><div class="menu"><h1>今天，和谁玩捉迷藏？</h1><div class="label"><span>选一关</span><span>每局 30 秒 · 所有关卡都能玩</span></div><div class="levels">'+COUNTS.map((n,i)=>'<button class="level '+(i===saved.level?'selected':'')+'" data-level="'+i+'" aria-label="第'+(i+1)+'关，'+n+'个洞">'+(i+1)+'</button>').join('')+'</div><div class="label" style="margin-top:12px"><span>选择一个小伙伴</span><span>选好后，这一局只出现它</span></div><div class="characters">'+KEYS.map((k,i)=>'<button class="character '+(i===saved.char?'selected':'')+'" data-char="'+i+'" aria-label="选择'+NAMES[i]+'"><div class="art">'+art(k)+'</div><span>'+NAMES[i]+'</span></button>').join('')+'</div><div class="menubottom"><button class="secondary" id="collectionBtn">★ 我的贴纸 <small>'+saved.stickers.length+'/10</small></button><button class="primary" id="startBtn">开始游戏 ▶</button></div></div></section>';document.querySelectorAll('[data-level]').forEach(b=>b.onclick=()=>{saved.level=+b.dataset.level;persist();home()});document.querySelectorAll('[data-char]').forEach(b=>b.onclick=()=>{saved.char=+b.dataset.char;persist();home()});$('startBtn').onclick=()=>{audioReady();start()};$('collectionBtn').onclick=collection}

function loop(){sync();requestAnimationFrame(loop)}
function removeTarget(){if(run&&run.index>=0){const h=document.querySelector('[data-hole="'+run.index+'"]');if(h){h.innerHTML='';h.classList.remove('hint')}}if(run)run.index=-1}
function tap(e){if(state!=='playing'||!run)return;sync();if(state!=='playing')return;const h=e.target.closest('[data-hole]');if(!h)return;e.preventDefault();const rect=h.getBoundingClientRect(),x=rect.x+rect.width/2,y=rect.y+rect.height*.5;fist(x,y);if(run.phase==='visible'&&+h.dataset.hole===run.index){run.score++;saved.total++;saved.perLevel[run.level]++;persist();$('score').textContent=run.score;removeTarget();run.phase='gap';run.phaseLeft=GAPS[run.level];tone(784,.15,.055);tone(1047,.18,.04,.08);flyStar(x,y)}else tone(260,.07,.018)}
function fist(x,y){let f=$('fist'),coach=document.querySelector('.coach').getBoundingClientRect();effects=effects.filter(a=>a.playState==='running');f.getAnimations().forEach(a=>a.cancel());const a=f.animate([{transform:'translate('+(coach.right-60)+'px,'+(coach.y+coach.height*.55)+'px) rotate(-25deg)',opacity:0},{transform:'translate('+(x-52)+'px,'+(y-46)+'px) rotate(10deg)',opacity:1,offset:.4},{transform:'translate('+(x-52)+'px,'+(y-25)+'px) rotate(23deg)',opacity:1,offset:.6},{transform:'translate('+(coach.right-60)+'px,'+(coach.y+coach.height*.55)+'px) rotate(-20deg)',opacity:0}],{duration:420,easing:'ease-out'});effects.push(a)}
function flyStar(x,y){let el=document.createElement('span');el.className='spark';el.textContent='★';document.body.append(el);const r=$('scoreInfo').getBoundingClientRect();let a=el.animate([{left:x+'px',top:y+'px',transform:'scale(.4)',opacity:1},{left:(x-20)+'px',top:(y-50)+'px',transform:'scale(1.3)',opacity:1,offset:.28},{left:(r.x+18)+'px',top:(r.y+5)+'px',transform:'scale(.6)',opacity:0}],{duration:650,easing:'ease-in-out'});effects.push(a);a.onfinish=()=>el.remove();a.oncancel=()=>el.remove()}
function showDialog(html){$('overlay').innerHTML='<div class="dialog" role="dialog" aria-modal="true">'+html+'</div>';$('overlay').hidden=false}
function pause(){if(state!=='playing')return;sync();if(state!=='playing')return;state='paused';stopMusic();document.body.classList.add('paused');effects.forEach(a=>{if(a.playState==='running')a.pause()});showDialog('<h2>休息一下</h2><p>小伙伴在花园等你</p><div class="buttons"><button class="primary" id="resumeBtn">继续玩 ▶</button><button class="secondary" id="leaveBtn">返回首页</button></div>');$('resumeBtn').onclick=resume;$('leaveBtn').onclick=confirmExit}
function resume(){if(state!=='paused')return;state='playing';last=performance.now();$('overlay').hidden=true;document.body.classList.remove('paused');effects.forEach(a=>{if(a.playState==='paused')a.play()});audioReady();startMusic()}
function confirmExit(){if(state==='playing')pause();if(!run)return;state='paused';showDialog('<h2>要回花园首页吗？</h2><p>已经得到的 '+run.score+' 颗星星会保留<br>完成 30 秒才会获得本关贴纸</p><div class="buttons"><button class="primary" id="stayBtn">继续玩</button><button class="secondary" id="exitBtn">返回首页</button></div>');$('stayBtn').onclick=resume;$('exitBtn').onclick=home}
function finish(){state='result';stopMusic();removeTarget();clearEffects();if(!saved.stickers.includes(run.level))saved.stickers.push(run.level);persist();$('pauseBtn').hidden=true;$('seconds').textContent=0;showDialog('<h2>这一关玩得真开心！</h2><div>本次获得</div><div class="bigscore">★ '+run.score+'</div><div>收好你的第 '+(run.level+1)+' 关贴纸！</div><div style="width:72px;height:72px;margin:0 auto">'+sticker(run.level)+'</div><div class="buttons"><button class="primary" id="nextBtn">'+(run.level<9?'下一关 ▶':'再玩一次 ↻')+'</button><button class="secondary" id="againBtn">重新玩</button><button class="secondary" id="resultHome">首页</button></div>');$('nextBtn').onclick=()=>{saved.level=Math.min(9,run.level+1);persist();start()};$('againBtn').onclick=start;$('resultHome').onclick=home;[523,659,784,1047].forEach((hz,i)=>tone(hz,.25,.045,i*.12));for(let i=0;i<24;i++){let e=document.createElement('i');e.className='confetti';e.style.background=['#f7c950','#ed8db3','#83c8de','#a8cb68'][i%4];document.body.append(e);let a=e.animate([{transform:'translate('+Math.random()*innerWidth+'px,-20px) rotate(0deg)',opacity:1},{transform:'translate('+Math.random()*innerWidth+'px,'+innerHeight+'px) rotate(300deg)',opacity:0}],{duration:1500+i*30});effects.push(a);a.onfinish=()=>e.remove();a.oncancel=()=>e.remove()}}
function collection(){showDialog('<h2>我的花园贴纸</h2><p>完成一关，就能收集一张贴纸</p><div class="stickers">'+COUNTS.map((_,i)=>'<div class="sticker '+(saved.stickers.includes(i)?'':'locked')+'">'+sticker(i)+'<span>第 '+(i+1)+' 关 '+(saved.stickers.includes(i)?'✓':'·')+'</span></div>').join('')+'</div><p>已收集 '+saved.stickers.length+' / 10 张 · 共得到 '+saved.total+' 颗星星</p><button class="primary" id="closeCollection">回去玩</button>');$('closeCollection').onclick=()=>{$('overlay').hidden=true}}
$('soundBtn').onclick=()=>{saved.muted=!saved.muted;persist();audioReady();setTop(state!=='home');if(state==='result')$('pauseBtn').hidden=true};$('pauseBtn').onclick=pause;$('backBtn').onclick=()=>{if(state==='result')home();else confirmExit()};document.addEventListener('visibilitychange',()=>{if(document.hidden)pause()});window.addEventListener('blur',pause);window.nativePause=pause;window.nativeBack=()=>{if(state==='playing'||state==='paused')confirmExit();else home()};home();requestAnimationFrame(loop);
</script></body></html>
