<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>佩奇欢乐打地鼠</title><style>
:root{--pink:#f6a6bd;--green:#a8d982;--cream:#fff7d7;--brown:#8e5b45}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#9ddaf1 0 38%,#bfe58b 38%);font-family:Arial,"Microsoft YaHei",sans-serif;color:#573d35;overflow:hidden;touch-action:manipulation}.app{width:100vw;height:100vh;display:flex;flex-direction:column}.top{display:flex;align-items:center;justify-content:space-between;padding:12px 24px;background:#fff4cfb8}.title{font-size:clamp(20px,3vw,38px);font-weight:800;color:#df6387}.score{font-size:clamp(20px,3vw,34px);font-weight:800}.screen{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}.panel{background:#fff9e8e8;border:5px solid #efad72;border-radius:28px;padding:28px;max-width:900px;width:min(92vw,900px);text-align:center;box-shadow:0 8px 0 #b47d57}.panel h1{margin:0 0 18px;color:#df6387;font-size:clamp(28px,5vw,58px)}button{border:0;border-radius:18px;padding:14px 24px;margin:7px;background:#f7b2c6;color:#633f46;font-size:clamp(18px,2.5vw,28px);font-weight:800;box-shadow:0 5px 0 #c97b94;cursor:pointer}button:active{transform:translateY(4px);box-shadow:0 1px 0 #c97b94}.choices{display:flex;flex-wrap:wrap;justify-content:center}.choice.selected{outline:5px solid #78bd65;background:#d4f0ae}.game{width:min(94vw,1200px);height:min(78vh,760px);display:grid;gap:clamp(5px,1vw,14px);align-content:center}.hole{background:#8b5a44;border:clamp(3px,.5vw,7px) solid #6d4436;border-radius:50%;aspect-ratio:1;position:relative;overflow:visible;display:flex;align-items:center;justify-content:center}.target{font-size:clamp(26px,5vw,66px);position:absolute;bottom:3%;animation:pop .16s ease-out;cursor:pointer;filter:drop-shadow(0 3px 1px #714536)}@keyframes pop{from{transform:scale(.2) translateY(30px)}to{transform:scale(1) translateY(0)}}.hit{animation:hit .4s ease-out forwards}@keyframes hit{to{transform:translateY(-35px) scale(1.35);opacity:0}}.star{position:fixed;font-size:40px;pointer-events:none;animation:fly .55s ease-in forwards;z-index:5}@keyframes fly{to{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:.1}}.hint{font-size:clamp(16px,2vw,24px);margin:10px}.bottom{display:flex;justify-content:center;padding:10px}.small{font-size:16px;padding:8px 14px}
</style></head><body><div class="app"><div class="top"><div class="title">佩奇欢乐打地鼠</div><div class="score" id="score">★ 0</div></div><div class="screen" id="screen"></div><div class="bottom"><button class="small" id="pause" hidden>暂停</button><button class="small" id="home" hidden>返回首页</button></div></div><script>
const chars=[['普通地鼠','🐹'],['乔治','🐷'],['猪爸爸','🐽'],['猪妈妈','🐷'],['小鸭子','🦆'],['小鸡','🐤']],holes=[9,11,13,15,17,19,21,23,25,25];let level=0,char=chars[0],score=0,timer,paused=false,active=null;const $=id=>document.getElementById(id);function home(){clearInterval(timer);$('pause').hidden=$('home').hidden=true;score=0;$('score').textContent='★ 0';$('screen').innerHTML=`<div class="panel"><h1>🌼 佩奇欢乐打地鼠</h1><div class="hint">选择关卡和喜欢的角色，开始寻找吧！</div><div><b>选择关卡</b><div class="choices">${holes.map((n,i)=>`<button class="level" data-i="${i}">${i+1}</button>`).join('')}</div></div><div><b>选择角色</b><div class="choices">${chars.map((c,i)=>`<button class="char" data-i="${i}">${c[1]} ${c[0]}</button>`).join('')}</div></div><button id="start">开始游戏</button></div>`;document.querySelectorAll('.level').forEach(b=>b.onclick=()=>{level=+b.dataset.i;document.querySelectorAll('.level').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.querySelector('.level').classList.add('selected');document.querySelectorAll('.char').forEach(b=>b.onclick=()=>{char=chars[+b.dataset.i];document.querySelectorAll('.char').forEach(x=>x.classList.remove('selected'));b.classList.add('selected')});document.querySelector('.char').classList.add('selected');$('start').onclick=start}function start(){score=0;paused=false;$('score').textContent='★ 0';$('pause').hidden=$('home').hidden=false;$('pause').textContent='暂停';let n=holes[level];$('screen').innerHTML='<div class="game" id="game"></div>';let g=$('game');g.style.gridTemplateColumns=`repeat(${Math.ceil(Math.sqrt(n))},1fr)`;for(let i=0;i<n;i++){let h=document.createElement('div');h.className='hole';h.dataset.i=i;g.append(h)}let elapsed=0;timer=setInterval(()=>{if(paused)return;elapsed+=100; if(elapsed>=30000){clearInterval(timer);end();return}spawn()},100);spawn()}function spawn(){if(active||paused)return;let hs=[...document.querySelectorAll('.hole')],h=hs[Math.floor(Math.random()*hs.length)],t=document.createElement('div');t.className='target';t.textContent=char[1];h.append(t);active=t;t.onclick=e=>{e.stopPropagation();if(!active)return;score++;$('score').textContent='★ '+score;let s=document.createElement('div');s.className='star';s.textContent='⭐';s.style.left=e.clientX+'px';s.style.top=e.clientY+'px';s.style.setProperty('--dx',(window.innerWidth*.42-e.clientX)+'px');s.style.setProperty('--dy',(-window.innerHeight*.42-e.clientY)+'px');document.body.append(s);setTimeout(()=>s.remove(),600);t.classList.add('hit');active=null;setTimeout(()=>t.remove(),400)};let stay=Math.max(900,2500-level*170);setTimeout(()=>{if(t.isConnected){t.remove();active=null}},stay)}function end(){active=null;$('pause').hidden=true;$('screen').innerHTML=`<div class="panel"><h1>🎉 太棒了！</h1><div class="hint">本关获得</div><div style="font-size:60px">⭐ ${score}</div><button onclick="start()">再玩一次</button><button onclick="home()">返回首页</button></div>`} $('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'继续':'暂停'};$('home').onclick=home;home();</script></body></html>
