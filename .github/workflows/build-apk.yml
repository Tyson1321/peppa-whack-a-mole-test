name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - name: Prepare offline PWA files
        run: |
          cat > manifest.json <<'EOF'
          {"name":"佩奇欢乐打地鼠","short_name":"打地鼠","start_url":"./index.html","display":"fullscreen","background_color":"#bfe58b","theme_color":"#f6a6bd","icons":[]}
          EOF
          cat > service-worker.js <<'EOF'
          self.addEventListener('install',e=>e.waitUntil(caches.open('app-v1').then(c=>c.addAll(['./','./index.html','./manifest.json']))));
          self.addEventListener('fetch',e=>e.respondWith(caches.match(e.request).then(r=>r||fetch(e.request))));
          EOF
          sed -i 's#</head>#<link rel="manifest" href="manifest.json"><script>navigator.serviceWorker\.register("service-worker.js")</script></head>#' index.html
      - name: Build Android APK
        run: |
          npm install -g @bubblewrap/cli
          bubblewrap init --manifest manifest.json --directory twa
          bubblewrap build --directory twa --skipPwaValidation
      - uses: actions/upload-artifact@v4
        with:
          name: peppa-whack-a-mole-apk
          path: twa/app-release-signed.apk
          if-no-files-found: error
