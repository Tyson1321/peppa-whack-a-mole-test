name: Build and test Peppa APK
on:
  push:
    branches: ['peppa-blocks']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: peppa-blocks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test level rules
        run: node tests/engine.test.js
      - name: Install browser test tools
        run: npm install --no-save playwright@1.51.1 && npx playwright install --with-deps chromium
      - name: Test interaction and capture screenshots
        run: node tests/ui.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build installable debug-signed APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: PeppaBlocks-APK
          path: peppa-blocks/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Test-screenshots
          path: peppa-blocks/tests/screenshots/
