name: Publish verified test APK
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-test.yml']
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Retrieve successful build artifact
        run: |
          gh api repos/Tyson1321/peppa-whack-a-mole-test/actions/artifacts/9946699255/zip > artifact.zip
          echo 'abe43336565cc42ec8230ffd2ac474980dff0159fde41ddae25abe7e907efc4f  artifact.zip' | sha256sum -c -
          mkdir verified
          unzip -q artifact.zip -d verified
          cd verified
          sha256sum -c SHA256SUMS.txt
          grep -q '^PASS:' game-test-results.txt
      - name: Publish downloadable test build
        run: |
          gh release create test-v0.2.0 verified/PeppaGarden-0.2.0.apk verified/home-landscape.png verified/game-landscape.png verified/stickers-landscape.png verified/editable-source.zip verified/game-test-results.txt verified/package-info.txt verified/permissions.txt verified/SHA256SUMS.txt verified/安装说明.txt --target ffecb78ae95dae241b0e5eab3d64d43d50fab343 --prerelease --title '佩奇欢乐打地鼠 0.2.0 测试版' --notes '安卓横屏离线测试版。官网角色图片和全部游戏内容已内置；十关洞数、单目标、计分、暂停、角色选择、贴纸持久化已通过云端自动测试。APK 签名及无联网权限已检查。实机一加 Ace 5 安装和声音效果待实际体验确认。下载 PeppaGarden-0.2.0.apk 即可安装，其他文件为源码、截图和测试记录。'
